[project]
name = "tallyhq"
version = "0.1.0"
description = "TallyHQ — observing the US Congress. GitHub-style activity tracking for legislators."
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Bryan Bartley" }]
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pytz",                 # DuckDB requires pytz for AT TIME ZONE / TIMESTAMPTZ arithmetic
    "tzdata",               # IANA tz database (Python's zoneinfo on slim Linux images)
    "openai>=1.50",         # OpenAI SDK pointed at OpenRouter for LLM summaries
    "beautifulsoup4>=4.12",  # Wikipedia table parsing for PVI sync
    "slowapi>=0.1.9",        # Per-IP rate limiting on /api/search
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
conductor = "conductor.cli:main"
tallyhq   = "conductor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
