# Railway service config — TallyHQ web
# Persistent volume mounted at /data holds data/conductor.duckdb across deploys.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Intentionally no startCommand — let the Dockerfile's ENTRYPOINT
# (entrypoint.sh) + CMD chain run. startCommand replaces the whole
# image command and would skip the entrypoint's seed-DB step.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/"
healthcheckTimeout = 60
