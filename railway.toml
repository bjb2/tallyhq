# Railway service config — TallyHQ web
# Persistent volume mounted at /data holds data/conductor.duckdb across deploys.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m conductor.cli --db /data/conductor.duckdb politics web --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/"
healthcheckTimeout = 30
