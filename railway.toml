# Railway service config — TallyHQ web
# Persistent volume mounted at /data holds data/conductor.duckdb across deploys.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# CLI reads PORT + HOST from env vars; no shell expansion needed.
startCommand = "python -m conductor.cli --db /data/conductor.duckdb politics web --host 0.0.0.0"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/"
healthcheckTimeout = 60
